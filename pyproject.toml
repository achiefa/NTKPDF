[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.1.0"]
build-backend = "poetry_dynamic_versioning.backend"


[tool.poetry]
name = "ntkpdf"
version = "1.0.0"
authors = [ "Amedeo Chiefa" ]
description = "A tool for the NTK analysis"
# repository = "https://github.com/HEP-PBSP/colibri"
# readme = "README.md"


[tool.poetry.dependencies]
python = ">=3.9"
prompt_toolkit = "*"
h5py = "*"

jax = "*"

# colibri, pinned to its development branch. nnpdf is provided transitively by
# colibri (which pins https://github.com/NNPDF/nnpdf.git @ ntk_colibri), so it is
# intentionally NOT pinned here -- a second pin would have to be byte-identical or
# Poetry's resolver would conflict (strategy A).
colibri = { git = "https://github.com/HEP-PBSP/colibri.git", branch = "ntk" }


[tool.poetry.extras]
test = [
    "pytest",
    "hypothesis",
]

[tool.poetry.scripts]
ntkpdf = "ntkpdf.app:main"
ntkanalysis = "ntkpdf.scripts:ntkanalysis"

[tool.pytest.ini_options]
testpaths = ["ntkpdf/tests"]
markers = [
    "linux: mark test to run only on linux",
    "darwin: mark test to run only on macOS",
    "fit: mark test as requiring the downloaded test fit (network + model build)",
]
