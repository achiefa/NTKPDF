    title_eigenvalues: (full model)
  - name: nn
    title_eigenvalues: (NN only)


template: report.md

positivity:
  from_: fit

description:
  from_: fit

dataset_inputs:
  from_: fit

# Top-level theory context for the data/FK chain (loss page -> ntk_fast_kernel_arrays
# -> data -> dataset -> theoryid). Mirrors `current` (theory <- fit, theoryid <- theory).
theory:
  from_: fit
theoryid:
  from_: theory

dataspecs:
  - theoryid:
      from_: current
    pdf:
      from_: current
    fit:
      from_: current
    speclabel:
      from_: current
    dataset_inputs:
      from_: fit

t0_info:
